name: Flutter CI

on:
  push:
    branches:
      - main
      - develop
      - "**" 
  pull_request:

env:
  FLUTTER_VERSION: "3.44.1"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./flip_to_focus

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
        working-directory: ./flip_to_focus

      - name: Analyze
        run: flutter analyze
        working-directory: ./flip_to_focus

      - name: Run tests
        run: flutter test
        working-directory: ./flip_to_focus

  build_apk:
    name: Build APK (main & develop only)
    runs-on: ubuntu-latest
    needs: test

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./flip_to_focus

      - name: Build APK (release)
        run: flutter build apk --release
        working-directory: ./flip_to_focus

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: flip_to_focus/build/app/outputs/flutter-apk/app-release.apk