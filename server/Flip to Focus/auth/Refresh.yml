info:
  name: Refresh
  type: http
  seq: 4
  tags:
    - auth

http:
  method: POST
  url: "{{baseUrl}}/auth/token"
  body:
    type: form-urlencoded
    data:
      - name: refresh_token
        value: "{{$oauth2.credentials.refresh_token}}"
      - name: grant_type
        value: refresh_token
      - name: client_id
        value: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/auth/refresh"
      method: POST
      body:
        type: form-urlencoded
        data:
          - name: refresh_token
            value: ""
          - name: grant_type
            value: ""
          - name: client_id
            value: ""
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "access_token": "",
            "refresh_token": "",
            "token_type": "",
            "expires_in": 0
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/auth/refresh"
      method: POST
      body:
        type: form-urlencoded
        data:
          - name: refresh_token
            value: ""
          - name: grant_type
            value: ""
          - name: client_id
            value: ""
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": ""
              }
            ]
          }

docs: Refresh an access token.
