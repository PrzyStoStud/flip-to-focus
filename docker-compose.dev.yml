services:
  server:
    build: ./server
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/flip_to_focus.db
      - API_SECRET_KEY=development_secret_key
    volumes:
      - ./server:/app
      - server_data_dev:/app/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  server_data_dev:
    driver: local
